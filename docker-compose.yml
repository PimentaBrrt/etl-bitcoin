# =====================================================================
# docker compose up  -> sobe Postgres (DW + metadados) e Airflow
# ESPM — Data Integration 2026.1 — ETL Bitcoin
# =====================================================================

services:
  # ------------------------------------------------------------------
  # PostgreSQL: serve tanto o Data Warehouse (btc_dw) quanto o
  # backend de metadados do Airflow (airflow). O init cria ambos.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: btc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc_dw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc_dw"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # airflow-init: roda UMA vez, migra o banco e cria o usuario admin.
  # E o entrypoint OFICIAL da imagem que processa _AIRFLOW_WWW_USER_*.
  # ------------------------------------------------------------------
  airflow-init:
    build: .
    image: btc/etl-airflow:1.0
    container_name: btc_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://btc:btc@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: btc_dw
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      # --- Fonte 1: Mercado / Binance ---
      MARKET_BASE_URL: ${MARKET_BASE_URL:-https://api.binance.com}
      MARKET_SYMBOL: ${MARKET_SYMBOL:-BTCUSDT}
      MARKET_START_DATE: ${MARKET_START_DATE:-2018-02-01}
      MARKET_END_DATE: ${MARKET_END_DATE:-2023-03-31}
      MARKET_CIRCULATING_SUPPLY: ${MARKET_CIRCULATING_SUPPLY:-19800000}
      # --- (LEGADO) CoinGecko ---
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3/}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_COIN_ID: ${COINGECKO_COIN_ID:-bitcoin}
      COINGECKO_VS_CURRENCY: ${COINGECKO_VS_CURRENCY:-usd}
      COINGECKO_DAYS: ${COINGECKO_DAYS:-365}
      # --- Caminhos ---
      FNG_CSV_PATH: /opt/airflow/data/seeds/fear_and_greed.csv
      SQL_SCHEMA_PATH: /opt/airflow/sql/schema.sql
      SQL_SEED_PATH: /opt/airflow/sql/seed_dim_sentiment.sql
      # --- Migracao + criacao do admin (lidas pelo entrypoint OFICIAL) ---
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes: &airflow-vols
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./demo_run.py:/opt/airflow/demo_run.py:ro
    # "version" como comando faz o entrypoint oficial migrar o banco e criar
    # o admin (por causa das _AIRFLOW_* acima) e entao sair com sucesso.
    command: version

  # ------------------------------------------------------------------
  # webserver: a UI do Airflow (porta 8080).
  # ------------------------------------------------------------------
  airflow-webserver:
    build: .
    image: btc/etl-airflow:1.0
    container_name: btc_airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-vols
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------------
  # scheduler: executa as DAGs.
  # ------------------------------------------------------------------
  airflow-scheduler:
    build: .
    image: btc/etl-airflow:1.0
    container_name: btc_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-vols
    command: scheduler

volumes:
  pgdata:
